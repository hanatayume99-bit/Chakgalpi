<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>한 줄 책갈피</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
:root{--bg:#F6F1E6;--paper:#FFFDF7;--ink:#1D2B2A;--mut:#5C6663;--t:#0E6F69;--c:#B4411F;--note:#FFF1B8;--line:#DDD5C3;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191A;--paper:#202527;--ink:#EFEADD;--mut:#A8AFAB;--t:#5CC8BE;--c:#F29A78;--note:#4A4220;--line:#343B3C;--on:#16191A}}
:root[data-theme="dark"]{--bg:#16191A;--paper:#202527;--ink:#EFEADD;--mut:#A8AFAB;--t:#5CC8BE;--c:#F29A78;--note:#4A4220;--line:#343B3C;--on:#16191A}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center}
#shell{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column}
#app{flex:1;min-height:0;overflow-y:auto;padding-block:20px 28px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-family:'Noto Serif KR',serif;font-weight:800;font-size:26px;line-height:1.3;margin:4px 0 8px}
h2{font-family:'Noto Serif KR',serif;font-size:17px;margin:28px 0 12px;display:flex;align-items:baseline;gap:8px}
.mut{color:var(--mut);font-size:13px;line-height:1.5}
.btn{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;box-shadow:3px 3px 0 var(--t)}
.btn.o{background:var(--paper);color:var(--ink)}
.link{border:0;background:none;color:var(--t);font-weight:700;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.pill{min-height:44px;padding:0 4px;border:0;background:none;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
.chip{flex:1;min-height:44px;padding:0 6px;border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:4px;background:color-mix(in srgb,var(--paper) 45%,transparent);color:var(--ink);font-size:15px;font-weight:500;box-shadow:2px 2px 0 color-mix(in srgb,var(--line) 60%,transparent)}
.chip.on{border-color:color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--ink) 70%,transparent);color:var(--bg);font-weight:700;box-shadow:2px 2px 0 color-mix(in srgb,var(--t) 50%,transparent)}
.wj{display:flex;margin:4px 0 4px}
.wj span{flex:1;max-width:62px;aspect-ratio:1;border:1.5px solid var(--c);margin-left:-1.5px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-weight:800;font-size:30px;color:var(--ink);background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,var(--paper)}
.wj span:first-child{margin-left:0}
@keyframes tp{from{opacity:0}to{opacity:1}}
.wj.ty span i{font-style:normal;animation:tp .01s both;animation-delay:var(--d)}
@media (prefers-reduced-motion:reduce){.wj.ty span i{animation:none}}
.pill.on{color:var(--ink);font-weight:700;border-color:var(--c)}
.book{flex:none;position:relative;border-radius:3px 8px 8px 3px;color:#2B3332;padding:10px 8px 10px 14px;display:flex;align-items:flex-end;font-family:'Noto Serif KR',serif;font-weight:800;font-size:13px;line-height:1.35;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
.book:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12)}
.scroll{display:flex;gap:14px;overflow-x:auto;padding:0 2px 10px}
.note{position:relative;background:var(--note);padding:12px 14px 10px;margin:0 0 14px;box-shadow:1px 2px 0 rgba(0,0,0,.12);font-family:'Gaegu',cursive;font-size:19px;line-height:1.35}
.note:nth-child(odd){transform:rotate(-.6deg)}.note:nth-child(even){transform:rotate(.5deg)}
.note .who{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.heart{border:0;background:none;min-height:44px;min-width:44px;font-size:13px;font-weight:700;color:var(--c)}
.blur{filter:blur(6px);cursor:pointer}
.stamp{display:inline-block;border:2px solid var(--c);color:var(--c);font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;transform:rotate(-3deg)}
.rib{position:absolute;right:14px;top:-6px;width:20px;height:34px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.tagbtn{display:block;width:100%;text-align:left;border:2px dashed var(--t);background:var(--paper);border-radius:4px;padding:14px;color:var(--ink)}
input[type=text]{width:100%;min-height:50px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-family:'Gaegu',cursive;font-size:20px;padding:0 2px}
.bar{height:8px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;background:var(--t)}
.badges{display:flex;gap:10px}.bd{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bd b{display:flex;margin:0 auto 6px;width:62px;height:62px;border-radius:50%;border:2px dashed var(--line);align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:13px;line-height:1.2}
.bd.on{color:var(--ink);font-weight:700}.bd.on b{border:3px double var(--c);color:var(--c);transform:rotate(-6deg)}
nav{display:flex;border-top:2px solid var(--ink);background:var(--paper);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;min-height:54px;border:0;background:none;font-size:14px;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -4px 0 var(--c)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (min-width:900px){
#shell{max-width:1080px}
nav{order:-1;border-top:0;border-bottom:2px solid var(--ink);padding:0 22px}
nav button{flex:none;min-width:140px;min-height:56px;font-size:15px}
nav button.on{box-shadow:inset 0 -4px 0 var(--c)}
#app{padding-top:32px;padding-bottom:48px}
h1{font-size:34px}
.wj span{max-width:76px;font-size:38px}
.chip{flex:none;min-width:110px}
.scroll{flex-wrap:wrap;gap:24px;overflow-x:visible}
.btn{max-width:420px;display:block}
.note{max-width:640px}
.tagbtn{max-width:480px}
#rv{max-width:640px}
.badges{max-width:520px}
.bar{max-width:520px}
.chip:hover,.tagbtn:hover,.btn:hover{filter:brightness(.96)}
.scroll>button:hover .book{transform:translateY(-4px)}
.book{transition:transform .15s}
#toast{bottom:32px}
}
</style>
<div id="shell"><main id="app"></main><nav id="nav"></nav></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var BOOKS=[
{id:0,t:"시간을 파는 상점",a:"[저자명]",g:"소설",col:"#A9DDD6",loan:true,desc:"시간을 사고파는 수상한 상점 이야기."},
{id:1,t:"샘플 도서 A",a:"[저자명]",g:"에세이",col:"#F6BFAE",loan:true,desc:"[도서 소개 자리]"},
{id:2,t:"샘플 도서 B",a:"[저자명]",g:"과학",col:"#B9CCEC",loan:false,desc:"[도서 소개 자리]"},
{id:3,t:"샘플 도서 C",a:"[저자명]",g:"소설",col:"#D3C1EC",loan:true,desc:"[도서 소개 자리]"},
{id:4,t:"샘플 도서 D",a:"[저자명]",g:"에세이",col:"#F3E0A0",loan:true,desc:"[도서 소개 자리]"},
{id:5,t:"샘플 도서 E",a:"[저자명]",g:"과학",col:"#BCE0C8",loan:true,desc:"[도서 소개 자리]"},
{id:6,t:"천개의 파랑",a:"천선란",g:"소설",col:"#A9CBF0",loan:true,desc:"[도서 소개 자리]"},
{id:7,t:"메리골드 마음 세탁소",a:"윤정은",g:"소설",col:"#F7D58A",loan:true,desc:"[도서 소개 자리]"}];
var SEED={0:[["민지","읽다 보면 마음이 좀 따뜻해져. 나라면 시간으로 뭐 하지?",12,0],["서준","설정이 신기해서 한 번에 다 읽음",8,0],["하은","결말에 반전 있음",5,1]],1:[["도윤","짧아서 부담 없어",3,0]],3:[["예진","첫 장부터 궁금해짐",4,0]],6:[["지안","속도보다 중요한 건, 멈추지 않고 나아가는 마음이야",0,0]],7:[["서윤","괜찮아, 마음 아픈 거 정상이야 마음이 아프다는 군 진심으로 최선을 다 했다는 거야",0,0]]};
var S0={fav:{},st:{},liked:{},rep:{},mine:{},pts:0,acts:0,bd:{}};
var S;try{S=JSON.parse(localStorage.getItem("hjc")||"null")||S0}catch(e){S=S0}
function hap(p){try{var H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;if(H){if(p===2)H.notification({type:'SUCCESS'});else H.impact({style:'LIGHT'})}else if(navigator.vibrate)navigator.vibrate(p===2?[12,40,18]:10)}catch(e){}}
function save(){try{localStorage.setItem("hjc",JSON.stringify(S))}catch(e){}}
var TYPED=false,V="home",SEL=0,GEN="전체",TAB="want",SP={};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cover(b,w,h){return '<div class="book" style="width:'+w+'px;height:'+h+'px;background:'+b.col+'">'+esc(b.t)+'</div>'}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2200)}
function award(p,m){hap(2);S.pts+=p;S.acts++;save();toast(m+" (+"+p+")")}
function badge(k,m){if(!S.bd[k]){S.bd[k]=1;save();setTimeout(function(){toast("‘"+m+"’ 도장 받았어!")},2300)}}
function revs(id){return (SEED[id]||[]).map(function(r,i){return{n:r[0],t:r[1],l:r[2],sp:r[3],k:"s"+id+"_"+i}}).concat((S.mine[id]||[]).map(function(r,i){return{n:"나",t:r.t,l:0,sp:r.sp,k:"m"+id+"_"+i}}))}
function shelf(title,list){return '<h2>'+title+'</h2><div class="scroll">'+list.map(function(b){return '<button data-a="open" data-id="'+b.id+'" style="border:0;background:none;padding:0;text-align:left;width:104px;flex:none">'+cover(b,104,144)+'<div style="font-size:13px;margin-top:8px">'+esc(b.t)+'</div></button>'}).join("")+'</div>'}
function nav(){document.getElementById("nav").innerHTML=[["home","책 찾기"],["mine","내 책갈피"],["chal","챌린지"]].map(function(x){return '<button data-a="go" data-v="'+x[0]+'" class="'+((V==x[0]||(V=="book"&&x[0]=="home"))?"on":"")+'">'+x[1]+'</button>'}).join("")}
function home(){var l=BOOKS.filter(function(b){return GEN=="전체"||b.g==GEN});
var pop=l.slice().sort(function(a,b){return revs(b.id).length-revs(a.id).length});
var ty=!TYPED;TYPED=true;
return '<div class="wj'+(ty?' ty':'')+'" role="img" aria-label="한 줄 책갈피">'+"한줄책갈피".split("").map(function(c,i){return '<span style="--d:'+(0.1+i*0.12)+'s"><i>'+c+'</i></span>'}).join("")+'</div><div style="height:14px"></div>'
+'<button class="tagbtn" data-a="nfc"><b>책 뒤 책갈피에 폰 대보기</b></button>'
+'<div style="display:flex;gap:8px;margin-top:18px">'+["전체","소설","에세이","과학"].map(function(g){return '<button class="chip '+(g==GEN?"on":"")+'" data-a="gen" data-g="'+g+'">'+g+'</button>'}).join("")+'</div>'
+shelf("요즘 많이 보는 책",pop)+shelf("친구들이 추천한 책",l.slice().reverse())}
function book(){var b=BOOKS[SEL],f=S.fav[b.id],st=S.st[b.id];
var h='<button class="link" data-a="go" data-v="home" style="margin-left:-4px">← 돌아가기</button>'
+'<div style="display:flex;gap:16px;margin-top:6px">'+cover(b,108,152)+'<div style="display:flex;flex-direction:column;justify-content:flex-end;gap:6px"><div style="font-family:\'Noto Serif KR\',serif;font-weight:800;font-size:21px;line-height:1.3">'+esc(b.t)+'</div><div class="mut">'+esc(b.a)+' · '+b.g+'</div><div class="mut">우리 도서관에 있음 · <b style="color:'+(b.loan?'var(--t)':'var(--c)')+'">'+(b.loan?"빌릴 수 있어":"누가 빌려감")+'</b></div></div></div>'
+'<div style="height:18px"></div>'
+'<button class="btn '+(f?"o":"")+'" data-a="fav">'+(f?"찜해둔 책이야 (누르면 취소)":"읽고 싶어, 찜하기")+'</button>'
+(f&&st!="reading"&&st!="done"?'<button class="btn o" style="margin-top:12px" data-a="start">지금 읽기 시작</button>':"")
+(st=="reading"?'<button class="btn o" style="margin-top:12px" data-a="done">다 읽었어</button>':"")
+'<h2>친구들 한 줄 <span class="mut">'+revs(b.id).length+'개</span></h2>';
var r=revs(b.id);if(!r.length)h+='<p class="mut">아직 아무도 안 썼어. 네가 첫 번째로 남겨봐.</p>';
r.forEach(function(x){var hide=x.sp&&!SP[x.k],rp=S.rep[x.k];
h+='<div class="note">'+(rp?'<span style="font-family:\'Noto Sans KR\';font-size:14px">신고돼서 선생님이 확인 중이야.</span>':'<div class="'+(hide?"blur":"")+'" '+(hide?'data-a="spoil" data-k="'+x.k+'" role="button" tabindex="0"':"")+'>'+esc(x.t)+'</div>')
+'<div class="who"><span>'+esc(x.n)+(x.sp?' <span class="stamp">스포 있음</span>':"")+(hide?" · 눌러서 보기":"")+(rp?"":' · <button data-a="rep" data-k="'+x.k+'" style="border:0;background:none;font-size:12px;color:var(--mut);min-height:44px">신고</button>')+'</span><button class="heart" data-a="like" data-k="'+x.k+'" aria-label="공감">'+(S.liked[x.k]?"♥":"♡")+' '+(x.l+(S.liked[x.k]?1:0))+'</button></div></div>'});
h+='<div style="margin-top:20px"><label for="rv" style="font-weight:700;font-size:15px">나도 한 줄 남기기</label><input type="text" id="rv" maxlength="60" placeholder="이 책, 한마디로?" autocomplete="off"><label class="mut" style="display:flex;align-items:center;gap:8px;min-height:44px"><input type="checkbox" id="sp"> 스포 있어요</label><button class="btn" data-a="post">붙이기</button></div>';return h}
function mine(){var L=Math.floor(S.pts/40)+1,gs={};BOOKS.forEach(function(b){if(S.fav[b.id])gs[b.g]=1});if(Object.keys(gs).length>=3)badge("gen","장르 도전");
var ids=BOOKS.filter(function(b){var s=S.st[b.id];return TAB=="want"?(S.fav[b.id]&&!s):s==TAB});
return '<h1>내 책갈피</h1><div style="border-left:4px solid var(--c);padding:2px 0 2px 14px"><div style="font-family:\'Noto Serif KR\',serif;font-weight:800;font-size:20px">Lv.'+L+' <span class="mut" style="font-weight:400">· '+S.pts+'점</span></div><div class="mut">이번 주 '+(S.acts%5)+'/5</div><div class="bar"><i style="width:'+((S.acts%5)*20)+'%"></i></div></div>'
+'<div style="display:flex;gap:14px;margin-top:22px">'+[["want","읽고 싶은"],["reading","읽는 중"],["done","다 읽음"]].map(function(x){return '<button class="pill '+(TAB==x[0]?"on":"")+'" data-a="tab" data-t="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'
+'<div class="scroll" style="flex-wrap:wrap;margin-top:14px">'+(ids.length?ids.map(function(b){return '<button data-a="open" data-id="'+b.id+'" style="border:0;background:none;padding:0">'+cover(b,96,134)+'</button>'}).join(""):'<p class="mut">여긴 아직 비어 있어. 책 찾기에서 마음에 드는 책을 찜해봐.</p>')+'</div>'
+'<h2>받은 도장</h2><div class="badges">'+[["first","첫 독서"],["rev","한 줄 남김"],["gen","장르 도전"]].map(function(x){return '<div class="bd '+(S.bd[x[0]]?"on":"")+'"><b>'+(S.bd[x[0]]?x[1]:"")+'</b>'+(S.bd[x[0]]?"":x[1])+'</div>'}).join("")+'</div>'
+'<button class="link" data-a="reset" style="margin-top:24px">기록 싹 지우기</button>'}
function chal(){return '<h1>같이 읽기</h1>'
+'<h2>이달의 도전</h2><div style="border:2px solid var(--ink);padding:14px;background:var(--paper)"><b>안 읽던 장르 한 권 찜하기</b><div class="bar"><i style="width:'+Math.min(100,Object.keys(S.fav).length*34)+'%"></i></div></div>'
+'<h2>우리 반 미션</h2><div style="border:2px solid var(--ink);padding:14px;background:var(--paper)"><div style="display:flex;justify-content:space-between"><b>[학급명]</b><span class="mut">샘플</span></div><div class="bar"><i style="width:45%"></i></div></div>'
+'<h2>명예의 전당</h2>'+["이달의 독서 도전자","잘 쓴 한 줄","장르 개척자"].map(function(t){return '<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)"><b>'+t+'</b><span class="mut">[학생 이름 자리]</span></div>'}).join("")}
function render(){try{var h=V=="book"?"#book="+SEL:"";if(location.hash!=h)history.replaceState(null,"",location.pathname+location.search+h)}catch(e){}var a=document.getElementById("app");a.innerHTML=V=="home"?home():V=="book"?book():V=="mine"?mine():chal();nav();a.scrollTop=0}
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,b=BOOKS[SEL];hap(1);
if(a=="go"){V=el.dataset.v;TYPED=false;render()}
else if(a=="open"){SEL=+el.dataset.id;V="book";render()}
else if(a=="nfc"){toast("태그 인식 완료");SEL=0;V="book";render()}
else if(a=="gen"){GEN=el.dataset.g;render()}
else if(a=="tab"){TAB=el.dataset.t;render()}
else if(a=="fav"){if(S.fav[b.id]){delete S.fav[b.id];save()}else{S.fav[b.id]=1;award(5,"찜했어")}render()}
else if(a=="start"){S.st[b.id]="reading";award(5,"읽기 시작");badge("first","첫 독서");render()}
else if(a=="done"){S.st[b.id]="done";award(10,"다 읽었네");render()}
else if(a=="like"){var k=el.dataset.k;if(S.liked[k])delete S.liked[k];else{S.liked[k]=1;award(2,"공감했어")}save();render()}
else if(a=="spoil"){SP[el.dataset.k]=1;render()}
else if(a=="rep"){S.rep[el.dataset.k]=1;save();toast("신고 접수됐어");render()}
